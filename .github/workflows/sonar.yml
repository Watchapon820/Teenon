name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: Test + Sonar analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar ต้องใช้ประวัติ git ทั้งหมดเพื่อระบุโค้ดใหม่/blame

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # รันเทสต์ฝั่ง Node แล้วสร้าง coverage/lcov.info (ใช้ฐานข้อมูลจำลอง ไม่ต้องมี MySQL)
      - run: npm run test:coverage

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
