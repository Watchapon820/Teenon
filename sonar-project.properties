# การตั้งค่าสแกนโค้ดด้วย SonarQube Cloud (วิเคราะห์ผ่าน GitHub Actions: .github/workflows/sonar.yml)
# ต้องแก้ 2 ค่า: organization กับ projectKey (ดูได้ที่หน้า Project Information ใน SonarQube Cloud)
# token ให้ตั้งเป็น GitHub secret ชื่อ SONAR_TOKEN ห้ามเขียนลงไฟล์นี้
sonar.organization=watchapon820
sonar.projectKey=Watchapon820_Teenon
sonar.projectName=Teenon

sonar.sourceEncoding=UTF-8
# โค้ดฝั่งเซิร์ฟเวอร์ (Node) อยู่ที่ root ส่วนแอป Flutter อยู่ใน lib
sonar.sources=.
sonar.inclusions=*.js,lib/**/*.dart,schema.sql
sonar.exclusions=node_modules/**,dist/**,tools/**,uploads/**,private_uploads/**,build/**,android/**,web/**,assets/**,.dart_tool/**,dont open/**,coverage/**,test/**

# เทสต์ฝั่ง Node (node --test) และรายงาน coverage ที่ c8 สร้าง (npm run test:coverage)
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# seed.js เป็นสคริปต์ตั้งต้นฐานข้อมูล ไม่นับ coverage
sonar.coverage.exclusions=seed.js,test/**
