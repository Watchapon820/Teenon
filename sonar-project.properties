# การตั้งค่าสแกนโค้ดด้วย SonarQube / SonarCloud
# ต้องแก้ 2 ค่า (host.url กับ projectKey) ส่วน token ให้ตั้งเป็นตัวแปรสภาพแวดล้อม SONAR_TOKEN ห้ามเขียนลงไฟล์นี้
sonar.projectKey=CHANGE_ME_PROJECT_KEY
sonar.projectName=Teenon
sonar.host.url=CHANGE_ME_SERVER_URL

sonar.sourceEncoding=UTF-8
# โค้ดฝั่งเซิร์ฟเวอร์ (Node) อยู่ที่ root ส่วนแอป Flutter อยู่ใน lib
sonar.sources=.
sonar.inclusions=*.js,lib/**/*.dart,schema.sql
sonar.exclusions=node_modules/**,dist/**,tools/**,uploads/**,private_uploads/**,build/**,android/**,web/**,assets/**,.dart_tool/**,dont open/**
